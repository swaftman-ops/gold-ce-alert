name: CE Alert

on:
  schedule:
    - cron: "*/5 * * * 0-5"     # every 5 min, Sunday to Friday (UTC), gold is closed on Saturday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ce-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python ce_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: Save state
        run: |
          git config user.name "ce-bot"
          git config user.email "ce-bot@users.noreply.github.com"
          git add last_alert.txt || true
          git diff --staged --quiet || (git commit -m "update state" && git push)
